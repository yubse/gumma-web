<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gumma illustration studio." />
    <title>Gumma</title>
    <link
      rel="preload"
      as="image"
      href="assets/1.webp?v=20260821-7"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="styles.css?v=20260821-13" />
    <script src="drawer.js?v=20260821-8" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-left">
        <button
          class="drawer-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="site-drawer"
          data-drawer-toggle
        >
          <span></span>
          <span></span>
        </button>
      </div>

      <a class="logo" href="./" aria-label="Gumma 首页">
        <img src="assets/logo.png?v=20260819-2" alt="Gumma" />
      </a>

      <a
        class="instagram-link"
        href="https://www.instagram.com/gumma.art?igsh=MWczbzkza3F4bHZzZQ%3D%3D&amp;utm_source=qr"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="在新窗口打开 Instagram"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.25"></circle>
          <circle class="ig-dot" cx="17.4" cy="6.7" r="1"></circle>
        </svg>
      </a>
    </header>

    <div class="drawer-backdrop" data-drawer-backdrop></div>
    <aside
      class="site-drawer"
      id="site-drawer"
      aria-hidden="true"
      tabindex="-1"
      data-drawer
    >
      <nav class="drawer-nav" aria-label="Site navigation">
        <a class="drawer-item" href="blog.html">Blog</a>
        <a class="drawer-item" href="contact.html">Contact</a>
      </nav>
    </aside>

    <main class="home-main">
      <section class="home-gallery" aria-label="Featured artwork">
        <article class="home-project home-project--portrait">
          <a
            class="home-project-link"
            href="project.html?project=gumma"
            aria-label="View the Gumma project"
          >
            <picture class="home-project-media">
              <source srcset="assets/1.webp?v=20260821-7" type="image/webp" />
              <img
                src="assets/1.png?v=20260821-7"
                alt="Gumma illustrated bear"
                width="1055"
                height="1491"
                loading="eager"
                fetchpriority="high"
                decoding="sync"
              />
            </picture>

            <span class="home-project-cta" aria-hidden="true">
              <span>Gumma</span>
            </span>
          </a>
        </article>

        <article class="home-project home-project--landscape">
          <a
            class="home-project-link"
            href="project.html?project=plant"
            aria-label="View the Silver Queen project"
          >
            <picture class="home-project-media">
              <source srcset="assets/2.webp?v=20260821-11" type="image/webp" />
              <img
                src="assets/2.png?v=20260821-11"
                alt="Silver Queen handcrafted plant in warm sunlight"
                width="1448"
                height="1086"
                loading="lazy"
                decoding="async"
              />
            </picture>

            <span class="home-project-cta" aria-hidden="true">
              <span>Silver Queen</span>
            </span>
          </a>
        </article>
      </section>
    </main>
  </body>
</html>
