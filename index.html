<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gumma illustration studio." />
    <title>Gumma</title>
    <link
      rel="preload"
      as="image"
      href="assets/1.png?v=20260821-4"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="styles.css?v=20260821-5" />
    <script src="script.js?v=20260820-2" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./" aria-label="Gumma 首页">
        <img src="assets/logo.png?v=20260819-2" alt="Gumma" />
      </a>

      <a
        class="instagram-link"
        href="https://www.instagram.com/gumma.art?igsh=MWczbzkza3F4bHZzZQ%3D%3D&amp;utm_source=qr"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="在新窗口打开 Instagram"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.25"></circle>
          <circle class="ig-dot" cx="17.4" cy="6.7" r="1"></circle>
        </svg>
      </a>
    </header>

    <main class="home-main">
      <section
        class="carousel"
        aria-label="精选作品"
        aria-roledescription="carousel"
        data-carousel
      >
        <div class="carousel-stage" aria-live="polite">
          <article
            class="carousel-slide is-active"
            aria-label="1 / 2"
            aria-hidden="false"
            data-slide
          >
            <a
              class="slide-link"
              href="project.html?project=gumma"
              aria-label="查看 Gumma 小熊作品详情"
            >
              <img
                src="assets/1.png?v=20260821-4"
                alt="Gumma 手绘小熊"
                width="711"
                height="1065"
                loading="eager"
                fetchpriority="high"
                decoding="sync"
              />
            </a>
          </article>

          <article
            class="carousel-slide"
            aria-label="2 / 2"
            aria-hidden="true"
            data-slide
          >
            <a
              class="slide-link"
              href="project.html?project=plant"
              aria-label="查看 Gumma 植物作品详情"
              tabindex="-1"
            >
              <picture>
                <source
                  srcset="assets/2.webp?v=20260821-4"
                  type="image/webp"
                />
                <img
                  src="assets/2.jpg?v=20260821-4"
                  alt="Gumma 手绘盆栽"
                  width="899"
                  height="1200"
                  loading="lazy"
                  decoding="async"
                />
              </picture>
            </a>
          </article>
        </div>

        <div class="carousel-footer">
          <div class="carousel-dots" aria-label="选择作品">
            <button
              class="carousel-dot is-active"
              type="button"
              aria-label="显示第 1 张作品"
              aria-current="true"
              data-carousel-dot="0"
            ></button>
            <button
              class="carousel-dot"
              type="button"
              aria-label="显示第 2 张作品"
              aria-current="false"
              data-carousel-dot="1"
            ></button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
