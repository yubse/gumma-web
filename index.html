<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gumma illustration studio." />
    <title>Gumma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./" aria-label="Gumma 首页">
        <img src="assets/logo.png?v=20260819-2" alt="Gumma" />
      </a>

      <!-- 把 href 替换成你自己的 Instagram 主页地址即可 -->
      <a
        class="instagram-link"
        href="https://www.instagram.com/gumma.art?igsh=MWczbzkza3F4bHZzZQ%3D%3D&utm_source=qr"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="在新窗口打开 Instagram"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.25"></circle>
          <circle class="ig-dot" cx="17.4" cy="6.7" r="1"></circle>
        </svg>
      </a>
    </header>

    <main class="hero">
      <img
        class="hero-image"
        src="assets/hero-meadow.png"
        alt="Gumma 小熊手绘插画"
        fetchpriority="high"
      />
    </main>
  </body>
</html>
